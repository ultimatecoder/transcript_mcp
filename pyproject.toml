[project]
name = "transcript-mcp"
version = "0.1.0"
description = "MCP server that downloads video transcripts. Supports YouTube."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "pygtrie>=2.5.0",
    "youtube-transcript-api>=1.2.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
